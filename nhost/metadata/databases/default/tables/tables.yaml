- table:
    schema: public
    name: organizations
  array_relationships:
    - name: memberships
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: org_members }
          column: org_id
    - name: workflows
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflows }
          column: org_id
    - name: usage
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: organization_usage }
          column: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, name, slug, calls_allowed, created_at, updated_at]
        filter:
          memberships:
            user_id: { _eq: X-Hasura-User-Id }
  update_permissions:
    - role: user
      permission:
        columns: [name, slug, calls_allowed]
        filter:
          memberships:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
        check: null

- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using: { foreign_key_constraint_on: org_id }
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            memberships:
              user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, user_id, role]
        check:
          organization:
            memberships:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
  update_permissions:
    - role: user
      permission:
        columns: [role]
        filter:
          organization:
            memberships:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            memberships:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using: { foreign_key_constraint_on: org_id }
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_steps }
          column: workflow_id
    - name: triggers
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_triggers }
          column: workflow_id
    - name: runs
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_runs }
          column: workflow_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
        filter:
          organization:
            memberships:
              user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    - role: user
      permission:
        columns: [id, org_id, name, description, is_active]
        set: { created_by: x-hasura-User-Id }
        check:
          organization:
            memberships:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
  update_permissions:
    - role: user
      permission:
        columns: [name, description, is_active]
        filter:
          organization:
            memberships:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            memberships:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }

- table:
    schema: public
    name: workflow_steps
  object_relationships:
    - name: workflow
      using: { foreign_key_constraint_on: workflow_id }
  array_relationships:
    - name: runs
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: step_runs }
          column: workflow_step_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, position, name, type, config, created_at, updated_at]
        filter:
          workflow:
            organization:
              memberships:
                user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, position, name, type, config]
        check:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
            - _and:
                - type: { _nin: [db_write, notify] }
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: editor }
  update_permissions:
    - role: user
      permission:
        columns: [position, name, type, config]
        filter:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
            - _and:
                - type: { _nin: [db_write, notify] }
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: editor }
        check:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
            - _and:
                - type: { _nin: [db_write, notify] }
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: editor }
  delete_permissions:
    - role: user
      permission:
        filter:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
            - _and:
                - type: { _nin: [db_write, notify] }
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: editor }

