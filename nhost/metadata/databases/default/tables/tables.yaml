- table:
    schema: public
    name: workflow_runs
  object_relationships:
    - name: workflow
      using: { foreign_key_constraint_on: workflow_id }
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: step_runs }
          column: workflow_run_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, trigger_type, triggered_by, status, input, output, error, started_at, completed_at, created_at, updated_at]
        filter:
          workflow:
            organization:
              memberships:
                user_id: { _eq: X-Hasura-User-Id }

- table:
    schema: public
    name: step_runs
  object_relationships:
    - name: run
      using: { foreign_key_constraint_on: workflow_run_id }
    - name: step
      using: { foreign_key_constraint_on: workflow_step_id }
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_run_id, workflow_step_id, position, step_name, step_type, status, input, output, error, attempt_count, approved_by, approved_at, started_at, completed_at, created_at, updated_at]
        filter:
          run:
            workflow:
              organization:
                memberships:
                  user_id: { _eq: X-Hasura-User-Id }

- table:
    schema: public
    name: organization_usage
  object_relationships:
    - name: organization
      using: { foreign_key_constraint_on: org_id }
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, period_start, calls_used, calls_allowed, updated_at]
        filter:
          organization:
            memberships:
              user_id: { _eq: X-Hasura-User-Id }

- table:
    schema: public
    name: organization_current_usage
  object_relationships:
    - name: organization
      using:
        manual_configuration:
          remote_table: { schema: public, name: organizations }
          column_mapping: { org_id: id }
          insertion_order: null
  select_permissions:
    - role: user
      permission:
        columns: [org_id, period_start, calls_used, calls_allowed, calls_remaining]
        filter:
          organization:
            memberships:
              user_id: { _eq: X-Hasura-User-Id }

- table:
    schema: public
    name: workflow_outputs
  object_relationships:
    - name: organization
      using: { foreign_key_constraint_on: org_id }
    - name: workflow
      using: { foreign_key_constraint_on: workflow_id }
    - name: run
      using: { foreign_key_constraint_on: workflow_run_id }
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, workflow_id, workflow_run_id, data, created_at]
        filter:
          organization:
            memberships:
              user_id: { _eq: X-Hasura-User-Id }

- table:
    schema: public
    name: notification_outbox
  object_relationships:
    - name: organization
      using: { foreign_key_constraint_on: org_id }
    - name: run
      using: { foreign_key_constraint_on: workflow_run_id }
  event_triggers:
    - name: send_notification_email
      definition:
        enable_manual: false
        insert:
          columns: '*'
      retry_conf:
        interval_sec: 10
        num_retries: 2
        timeout_sec: 30
      webhook: '{{NHOST_FUNCTIONS_URL}}/notification-events'
      headers:
        - name: x-nhost-webhook-secret
          value_from_env: NHOST_WEBHOOK_SECRET
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, workflow_run_id, recipient, subject, body, status, provider_id, error, sent_at, created_at, updated_at]
        filter:
          organization:
            memberships:
              user_id: { _eq: X-Hasura-User-Id }

- table:
    schema: public
    name: workflow_inbox_events
  object_relationships:
    - name: workflow
      using: { foreign_key_constraint_on: workflow_id }
  event_triggers:
    - name: start_workflow_from_database_event
      definition:
        enable_manual: false
        insert:
          columns: '*'
      retry_conf:
        interval_sec: 10
        num_retries: 2
        timeout_sec: 30
      webhook: '{{NHOST_FUNCTIONS_URL}}/workflow-events'
      headers:
        - name: x-nhost-webhook-secret
          value_from_env: NHOST_WEBHOOK_SECRET
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, payload, created_by, processed_at, created_at]
        filter:
          workflow:
            organization:
              memberships:
                user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    - role: user
      permission:
        columns: [workflow_id, payload]
        set: { created_by: x-hasura-User-Id }
        check:
          workflow:
            organization:
              memberships:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _in: [owner, editor] }
