- name: run_scheduled_workflows
  webhook: '{{NHOST_FUNCTIONS_URL}}/scheduled-workflows'
  schedule: '* * * * *'
  include_in_metadata: true
  payload: {}
  headers:
    - name: x-nhost-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
  retry_conf:
    num_retries: 1
    retry_interval_seconds: 10
    timeout_seconds: 45
    tolerance_seconds: 21600

